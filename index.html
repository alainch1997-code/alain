<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Suite - VIP Bookings</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #111;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #111;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #333;
        }
        #loading {
            text-align: center;
            display: none;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>حجز موعد - The Suite</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label for="name">اسم العميل</label>
                <input type="text" id="name" required placeholder="أدخل اسم العميل">
            </div>
            
            <div class="form-group">
                <label for="phone">رقم الهاتف</label>
                <input type="tel" id="phone" required placeholder="أدخل رقم الهاتف">
            </div>
            
            <div class="form-group">
                <label for="date">تاريخ الزيارة</label>
                <input type="date" id="date" required>
            </div>
            
            <div class="form-group">
                <label for="time">وقت الزيارة</label>
                <input type="time" id="time" required>
            </div>
            
            <div class="form-group">
                <label for="notes">ملاحظات</label>
                <textarea id="notes" rows="3" placeholder="أي تفاصيل إضافية..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn">تأكيد الحجز</button>
            <div id="loading">جاري حفظ الحجز... يرجى الانتظار</div>
        </form>
    </div>

    <script>
        // رابط الـ Google Apps Script الخاص بك
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEVz0_vOQqB21HfktWwMStFibsdhbA3NICOCppw1Xy_vvfBxpBWlFtTzOPXk8PW6r-8A/exec";

        document.getElementById("bookingForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            const loading = document.getElementById("loading");

            submitBtn.style.display = "none";
            loading.style.display = "block";

            const formData = {
                name: document.getElementById("name").value,
                phone: document.getElementById("phone").value,
                date: document.getElementById("date").value,
                time: document.getElementById("time").value,
                notes: document.getElementById("notes").value
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // ضروري لتجنب مشاكل الـ CORS مع جوجل
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert("تم تسجيل وحفظ الحجز بنجاح على الـ Google Sheet!");
                document.getElementById("bookingForm").reset();
            })
            .catch(error => {
                console.error("Error!", error);
                alert("حدث خطأ أثناء حفظ البيانات، يرجى المحاولة مرة أخرى.");
            })
            .finally(() => {
                submitBtn.style.display = "block";
                loading.style.display = "none";
            });
        });
    </script>

</body>
</html>
